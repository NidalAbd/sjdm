name: Deploy Laravel to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, json, pdo, curl, zip, bcmath
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Composer dependencies (for verification only - not deployed)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Create deployment structure
        run: |
          # Create two separate deployment directories
          mkdir -p deploy_laravel  # For Laravel files (goes to domain root)
          mkdir -p deploy_public   # For public files (goes to public_html)

      - name: Prepare Laravel files (outside public_html)
        run: |
          # Copy all Laravel files EXCEPT public folder and vendor (vendor uploaded manually via SSH)
          rsync -av \
            --exclude='public' \
            --exclude='vendor' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='deploy_laravel' \
            --exclude='deploy_public' \
            --exclude='tests' \
            --exclude='.github' \
            --exclude='README.md' \
            --exclude='phpunit.xml' \
            --exclude='vite.config.mjs' \
            --exclude='webpack.mix.js' \
            --exclude='package*.json' \
            --exclude='.editorconfig' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            ./ deploy_laravel/

      - name: Prepare public files (for public_html)
        run: |
          # Copy public folder contents to deploy_public
          cp -r public/* deploy_public/
          # Copy hidden files if any
          cp -r public/.[^.]* deploy_public/ 2>/dev/null || true

          # Remove any existing storage symlink
          if [ -L "deploy_public/storage" ]; then
            rm deploy_public/storage
          elif [ -d "deploy_public/storage" ]; then
            rm -rf deploy_public/storage
          fi

      - name: Update index.php for correct paths
        run: |
          # Update paths in index.php to point to Laravel files one level up from public_html
          sed -i "s|require __DIR__.'/../vendor/autoload.php';|require __DIR__.'/../vendor/autoload.php';|g" deploy_public/index.php
          sed -i "s|\$app = require_once __DIR__.'/../bootstrap/app.php';|\$app = require_once __DIR__.'/../bootstrap/app.php';|g" deploy_public/index.php

      - name: Update environment for production
        run: |
          cd deploy_laravel

          # Copy .env.example to .env if .env doesn't exist
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          # Update .env for production
          sed -i 's/APP_ENV=local/APP_ENV=production/' .env
          sed -i 's/APP_DEBUG=true/APP_DEBUG=false/' .env
          sed -i 's|APP_URL=http://localhost|APP_URL=https://sjdm.store|' .env
          sed -i 's/LOG_LEVEL=debug/LOG_LEVEL=error/' .env
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=localhost/' .env
          sed -i 's/DB_DATABASE=laravel/DB_DATABASE=u252000670_sjdm/' .env
          sed -i 's/DB_USERNAME=root/DB_USERNAME=u252000670_sjdm/' .env

          # Set database password from GitHub secret
          if [ ! -z "${{ secrets.DB_PASSWORD }}" ]; then
            sed -i "s/DB_PASSWORD=.*/DB_PASSWORD=${{ secrets.DB_PASSWORD }}/" .env
          fi

      - name: Create post-deployment script
        run: |
          cat > deploy_public/setup_storage.php << 'EOF'
          <?php
          echo "Starting post-deployment setup...\n";

          $laravelPath = dirname(__DIR__); // One level up from public_html
          $publicPath = __DIR__;
          $storagePath = $laravelPath . '/storage/app/public';

          // Change to Laravel directory for artisan commands
          chdir($laravelPath);

          // Clear Laravel caches
          echo "Clearing Laravel caches...\n";
          $commands = [
              'php artisan config:clear',
              'php artisan cache:clear',
              'php artisan view:clear',
              'php artisan route:clear',
              'php artisan optimize:clear'
          ];

          foreach ($commands as $command) {
              $output = shell_exec("$command 2>&1");
              echo "  $command: " . ($output ? trim($output) : 'OK') . "\n";
          }

          // Remove existing storage link/directory
          $storageLink = $publicPath . '/storage';
          if (file_exists($storageLink)) {
              if (is_link($storageLink)) {
                  unlink($storageLink);
                  echo "Removed existing storage symlink\n";
              } elseif (is_dir($storageLink)) {
                  // Remove directory recursively
                  array_map('unlink', glob("$storageLink/*.*"));
                  rmdir($storageLink);
                  echo "Removed existing storage directory\n";
              }
          }

          // Create storage directories if they don't exist
          if (!file_exists($storagePath)) {
              mkdir($storagePath, 0755, true);
              echo "Created storage/app/public directory\n";
          }

          // Create the symlink
          if (symlink($storagePath, $storageLink)) {
              echo "✅ Storage symlink created successfully!\n";
          } else {
              echo "❌ Failed to create storage symlink\n";
          }

          // Run migrations (optional - remove if not needed)
          // echo "Running migrations...\n";
          // shell_exec('php artisan migrate --force');

          echo "✅ Post-deployment setup completed!\n";

          // Delete this script after execution for security
          unlink(__FILE__);
          EOF

      - name: Set proper permissions
        run: |
          # Laravel files
          find deploy_laravel -type f -exec chmod 644 {} \;
          find deploy_laravel -type d -exec chmod 755 {} \;
          chmod -R 775 deploy_laravel/storage deploy_laravel/bootstrap/cache 2>/dev/null || true

          # Public files
          find deploy_public -type f -exec chmod 644 {} \;
          find deploy_public -type d -exec chmod 755 {} \;

      - name: Create .htaccess for public_html
        run: |
          cat > deploy_public/.htaccess << 'EOF'
          <IfModule mod_rewrite.c>
              <IfModule mod_negotiation.c>
                  Options -MultiViews -Indexes
              </IfModule>

              RewriteEngine On

              # Force HTTPS
              RewriteCond %{HTTPS} off
              RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

              # Handle Authorization Header
              RewriteCond %{HTTP:Authorization} .
              RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

              # Redirect Trailing Slashes If Not A Folder...
              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteCond %{REQUEST_URI} (.+)/$
              RewriteRule ^ %1 [L,R=301]

              # Send Requests To Front Controller...
              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteCond %{REQUEST_FILENAME} !-f
              RewriteRule ^ index.php [L]
          </IfModule>

          # Security headers
          <IfModule mod_headers.c>
              Header set X-Content-Type-Options "nosniff"
              Header set X-Frame-Options "SAMEORIGIN"
              Header set X-XSS-Protection "1; mode=block"
          </IfModule>
          EOF

      - name: Deploy Laravel files to domain root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./deploy_laravel/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/vendor/**
            **/node_modules/**
            **/public/**
            **/public_html/**
          log-level: minimal

      - name: Deploy public files to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./deploy_public/
          server-dir: ./
          log-level: minimal

      - name: Run post-deployment setup
        run: |
          echo "Waiting for files to sync..."
          sleep 10
          echo "Running post-deployment setup..."

          # Try to run the setup script
          response=$(curl -s -w "\nHTTPSTATUS:%{http_code}" https://smm-followerss.com/setup_storage.php)
          http_code=$(echo "$response" | grep "HTTPSTATUS" | cut -d':' -f2)

          if [ "$http_code" -eq 200 ] || [ "$http_code" -eq 404 ]; then
            echo "✅ Setup script executed (return 404 after self-deletion, which is expected)"
          else
            echo "⚠️ Setup returned HTTP $http_code - may need manual check"
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -rf deploy_laravel deploy_public
          echo "✅ Deployment completed!"
