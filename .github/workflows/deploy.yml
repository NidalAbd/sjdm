name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, openssl, tokenizer, json, fileinfo, gd, zip

      - name: Install Composer dependencies
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
          composer dump-autoload --optimize

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build assets
        run: |
          if [ -f "webpack.mix.js" ]; then
            npm run dev
          elif [ -f "vite.config.mjs" ]; then
            npm run build
          else
            echo "No build tool found, skipping asset build"
          fi

      - name: Create deployment package
        run: |
          # Remove unnecessary files for production
          rm -rf .git .github node_modules tests storage/framework/cache/* storage/framework/sessions/* storage/framework/views/* storage/logs/* .env.example composer.lock package-lock.json
          
          # Create .env file from example if it doesn't exist
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          
          # Set proper permissions
          chmod -R 755 storage bootstrap/cache

      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: talbna.cloud
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /
          exclude: |
            **/.git*
            **/.github*
            **/node_modules/**
            **/tests/**
            **/.env.example
            **/composer.lock
            **/package-lock.json
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/logs/**
            **/storage/app/public/**
            **/bootstrap/cache/**
          dangerous-clean-slate: false
          log-level: verbose
