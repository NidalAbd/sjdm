name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - Show current directory
        run: |
          echo "Current directory: $(pwd)"
          echo "Directory contents:"
          ls -la

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Debug - Check PHP installation
        run: |
          echo "PHP version:"
          php --version
          echo "PHP extensions:"
          php -m

      - name: Install Composer dependencies
        run: |
          echo "Installing Composer dependencies..."
          composer install --no-dev --optimize-autoloader --no-interaction
          echo "Composer dependencies installed successfully!"

      - name: Debug - Check Composer
        run: |
          echo "Composer version:"
          composer --version
          echo "Composer dependencies:"
          composer show --installed

      - name: Check Laravel installation
        run: |
          echo "Checking Laravel installation..."
          php artisan --version
          echo "Laravel is properly installed!"

      - name: Create deployment package
        run: |
          echo "Creating deployment package..."
          
          # Create deployment directory
          mkdir -p deployment
          echo "Deployment directory created"
          
          # Copy application files with exclusions (Windows compatible)
          echo "Copying application files..."
          
          # Copy everything first, then remove unwanted directories
          echo "Copying app directory..."
          cp -r app deployment/
          echo "Copying bootstrap directory..."
          cp -r bootstrap deployment/
          echo "Copying config directory..."
          cp -r config deployment/
          echo "Copying database directory..."
          cp -r database deployment/
          echo "Copying lang directory..."
          cp -r lang deployment/
          echo "Copying resources directory..."
          cp -r resources deployment/
          echo "Copying routes directory..."
          cp -r routes deployment/
          echo "Copying storage directory..."
          cp -r storage deployment/
          echo "Copying vendor directory..."
          cp -r vendor deployment/
          echo "Copying artisan file..."
          cp artisan deployment/
          echo "Copying composer files..."
          cp composer.json deployment/
          cp composer.lock deployment/
          
          # Remove unwanted files
          echo "Cleaning up storage directories..."
          rm -rf deployment/storage/logs/*
          rm -rf deployment/storage/framework/cache/*
          rm -rf deployment/storage/framework/sessions/*
          rm -rf deployment/storage/framework/views/*
          
          # Copy public files to public_html directory
          echo "Copying public files..."
          mkdir -p deployment/public_html
          cp -r public/* deployment/public_html/
          
          # Show deployment structure
          echo "Deployment package structure:"
          ls -la deployment/
          echo "Public HTML structure:"
          ls -la deployment/public_html/
          
          echo "Deployment package created successfully!"

      - name: Debug - Check deployment package
        run: |
          echo "Checking deployment package size:"
          du -sh deployment/
          echo "Checking deployment package contents:"
          find deployment/ -type f | head -20

      - name: Deploy to Hostinger via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: talbna.cloud
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: sftp
          local-dir: ./deployment/
          server-dir: /
          dangerous-clean-slate: false
          log-level: verbose

      - name: Deploy public files separately
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: talbna.cloud
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: sftp
          local-dir: ./deployment/public_html/
          server-dir: /public_html/
          dangerous-clean-slate: false
          log-level: verbose

      - name: Deployment Summary
        run: |
          echo "🎉 Deployment completed successfully!"
          echo "📁 Application files deployed to server root"
          echo "🌐 Public files deployed to public_html"
          echo "⏰ Deployment time: $(date)"
          echo "📝 Check your website at: https://talbna.cloud"
