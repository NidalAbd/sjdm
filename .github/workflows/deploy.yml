name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - List files
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Files in root ==="
          ls -la
          echo "=== Composer files ==="
          ls -la composer.*

      - name: Debug - Check PHP
        run: |
          echo "=== PHP version ==="
          php --version
          echo "=== Composer version ==="
          composer --version

      - name: Debug - Check dependencies
        run: |
          echo "=== Composer.json content ==="
          cat composer.json
          echo "=== Composer.lock exists ==="
          ls -la composer.lock

      - name: Simple deploy test
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: talbna.cloud
          ssh_private_key: ${{ secrets.SFTP_PRIVATE_KEY }}
          local_path: './'
          remote_path: '/'
