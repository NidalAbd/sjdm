name: Deploy Laravel to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allow manual deployment

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: production # Add environment protection

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Updated to latest version

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1' # Match your Laravel version
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, pdo, curl, zip, bcmath
          tools: composer:v2

      - name: Create deployment directory
        run: mkdir -p deploy_temp

      - name: Prepare Laravel files
        run: |
          # Copy all files except those we want to exclude (including vendor)
          rsync -av \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.git' \
            --exclude='deploy_temp' \
            --exclude='tests' \
            --exclude='.github' \
            --exclude='README.md' \
            --exclude='phpunit.xml' \
            --exclude='vite.config.js' \
            --exclude='package*.json' \
            ./ deploy_temp/

      - name: Setup correct Laravel structure
        run: |
          # Create the correct directory structure
          echo "Setting up Laravel project structure..."
          
          # Keep Laravel core folders at root level (same level as public_html will be)
          # Only move the public folder contents to public_html
          if [ -d "deploy_temp/public" ]; then
            # Create public_html directory
            mkdir -p deploy_temp/public_html
            
            # Copy all files and directories from public to public_html
            cp -r deploy_temp/public/* deploy_temp/public_html/ 2>/dev/null || true
            # Also copy hidden files if any
            cp -r deploy_temp/public/.[^.]* deploy_temp/public_html/ 2>/dev/null || true
            
            # Remove the public directory completely
            rm -rf deploy_temp/public
            echo "✓ Public folder contents moved to public_html"
          fi

          # Create storage directory structure at root level
          mkdir -p deploy_temp/storage/app/public
          mkdir -p deploy_temp/storage/framework/cache
          mkdir -p deploy_temp/storage/framework/sessions
          mkdir -p deploy_temp/storage/framework/views
          mkdir -p deploy_temp/storage/logs
          mkdir -p deploy_temp/bootstrap/cache

          # Set proper permissions for storage directories
          chmod -R 775 deploy_temp/storage
          chmod -R 775 deploy_temp/bootstrap/cache

          echo "✓ Storage directories created at root level"
          echo "✓ Laravel project structure:"
          echo "  - Core folders (app, bootstrap, config, etc.) at root level"
          echo "  - public_html/ contains only public files"
          echo "  - storage/ at root level (not inside public_html)"

      - name: Fix Laravel paths for shared hosting
        run: |
          # Update index.php to work with shared hosting structure
          sed -i "s|require __DIR__.'/../vendor/autoload.php';|require __DIR__.'/../vendor/autoload.php';|g" deploy_temp/public_html/index.php
          sed -i "s|\$app = require_once __DIR__.'/../bootstrap/app.php';|\$app = require_once __DIR__.'/../bootstrap/app.php';|g" deploy_temp/public_html/index.php

      - name: Update environment for production
        run: |
          cd deploy_temp

          # Copy .env.example to .env if .env doesn't exist
          if [ ! -f ".env" ]; then
            cp .env.example .env
            echo "Created .env from .env.example"
          fi

          # Modify existing .env for production
          sed -i 's/APP_ENV=local/APP_ENV=production/' .env
          sed -i 's/APP_DEBUG=true/APP_DEBUG=false/' .env
          sed -i 's|APP_URL=http://localhost|APP_URL=https://smm-followerss.com|' .env
          sed -i 's/LOG_LEVEL=debug/LOG_LEVEL=error/' .env
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=localhost/' .env

          # Note: Cache clearing will be done on server since vendor folder is not deployed

      - name: Create post-deployment script
        run: |
          # Create a script that will run on the server to recreate storage symlink and clear cache
          cat > deploy_temp/setup_storage.php << 'EOF'
          <?php
          echo "Starting post-deployment setup...\n";

          // This script runs from the root directory (same level as public_html)
          $publicPath = __DIR__ . '/public_html';
          $storagePath = __DIR__ . '/storage/app/public';

          echo "Current directory: " . __DIR__ . "\n";
          echo "Public path: $publicPath\n";
          echo "Storage path: $storagePath\n";

          // Clear Laravel caches first (since vendor exists on server)
          echo "Clearing Laravel caches...\n";
          $commands = [
              'php artisan config:clear',
              'php artisan cache:clear',
              'php artisan view:clear',
              'php artisan route:clear'
          ];

          foreach ($commands as $command) {
              $output = shell_exec("cd " . __DIR__ . " && $command 2>&1");
              if ($output) {
                  echo "  $command: " . trim($output) . "\n";
              }
          }

          // Remove existing storage directory/symlink in public_html if it exists
          if (file_exists($publicPath . '/storage')) {
              if (is_dir($publicPath . '/storage') && !is_link($publicPath . '/storage')) {
                  // Remove directory recursively
                  $files = new RecursiveIteratorIterator(
                      new RecursiveDirectoryIterator($publicPath . '/storage', RecursiveDirectoryIterator::SKIP_DOTS),
                      RecursiveIteratorIterator::CHILD_FIRST
                  );
                  foreach ($files as $fileinfo) {
                      $todo = ($fileinfo->isDir() ? 'rmdir' : 'unlink');
                      $todo($fileinfo->getRealPath());
                  }
                  rmdir($publicPath . '/storage');
                  echo "Removed existing storage directory from public_html\n";
              } elseif (is_link($publicPath . '/storage')) {
                  unlink($publicPath . '/storage');
                  echo "Removed existing storage symlink\n";
              }
          }

          // Create storage directory structure if it doesn't exist
          $storageDirs = [
              'storage/app/public',
              'storage/framework/cache',
              'storage/framework/sessions',
              'storage/framework/views',
              'storage/logs'
          ];

          foreach ($storageDirs as $dir) {
              if (!file_exists($dir)) {
                  mkdir($dir, 0755, true);
                  echo "Created directory: $dir\n";
              }
          }

          // Create the symlink
          if (symlink('../storage/app/public', $publicPath . '/storage')) {
              echo "✅ Storage symlink created successfully!\n";
              echo "public_html/storage -> ../storage/app/public\n";
          } else {
              echo "❌ Failed to create storage symlink\n";
              echo "Please check file permissions\n";
          }

          // Verify the symlink works
          if (is_link($publicPath . '/storage') && file_exists($publicPath . '/storage')) {
              echo "✅ Symlink verification: SUCCESS - Link is working\n";
          } else {
              echo "❌ Symlink verification: FAILED - Link is not working\n";
          }

          echo "✅ Post-deployment setup completed!\n";
          EOF

      - name: Set proper permissions
        run: |
          cd deploy_temp
          # Set proper permissions for Laravel
          find . -type f -exec chmod 644 {} \;
          find . -type d -exec chmod 755 {} \;
          chmod -R 775 storage bootstrap/cache
          chmod 644 public_html/index.php

      - name: Create .htaccess for public_html
        run: |
          cat > deploy_temp/public_html/.htaccess << 'EOF'
          <IfModule mod_rewrite.c>
              <IfModule mod_negotiation.c>
                  Options -MultiViews -Indexes
              </IfModule>

              RewriteEngine On

              # Handle Authorization Header
              RewriteCond %{HTTP:Authorization} .
              RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

              # Redirect Trailing Slashes If Not A Folder...
              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteCond %{REQUEST_URI} (.+)/$
              RewriteRule ^ %1 [L,R=301]

              # Send Requests To Front Controller...
              # Point to Laravel files in parent directory (same level as public_html)
              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteCond %{REQUEST_FILENAME} !-f
              RewriteRule ^ ../index.php [L]
          </IfModule>
          EOF

      - name: Verify deployment structure
        run: |
          echo "=== DEPLOYMENT STRUCTURE VERIFICATION ==="
          echo "Root level (Laravel project folders):"
          ls -la deploy_temp/ | grep -E "(app|bootstrap|config|database|resources|routes|storage|vendor)"
          echo ""
          echo "Public HTML contents (web-accessible files only):"
          ls -la deploy_temp/public_html/
          echo ""
          echo "Storage directory (at root level):"
          ls -la deploy_temp/storage/ || echo "Storage directory is empty or doesn't exist"
          echo ""
          echo "=== CRITICAL FILES CHECK ==="
          [ -f "deploy_temp/public_html/index.php" ] && echo "✓ index.php exists in public_html" || echo "✗ index.php missing from public_html"
          [ -f "deploy_temp/.env" ] && echo "✓ .env exists at root level" || echo "✗ .env missing from root level"
          [ -d "deploy_temp/vendor" ] && echo "✓ vendor directory exists at root level" || echo "✗ vendor directory missing from root level"
          [ -d "deploy_temp/storage" ] && echo "✓ storage directory exists at root level" || echo "✗ storage directory missing from root level"
          [ -d "deploy_temp/app" ] && echo "✓ app directory exists at root level" || echo "✗ app directory missing from root level"
          echo ""
          echo "=== STRUCTURE SUMMARY ==="
          echo "✅ Laravel core folders (app, bootstrap, config, etc.) at root level"
          echo "✅ public_html/ contains only web-accessible files"
          echo "✅ storage/ at root level (not inside public_html)"

      - name: Test FTP connection
        run: |
          echo "Testing FTP connection..."
          echo "Username: ${{ secrets.FTP_USERNAME }}"
          echo "Testing Hostinger FTP server..."

          # Test Hostinger FTP server
          server="45.84.207.200"
          echo "Testing server: $server"

          # Test FTP port 21 (only port Hostinger provides)
          if nc -z "$server" 21; then
            echo "✅ $server: Port 21 (FTP) is reachable"
          else
            echo "❌ $server: Port 21 (FTP) is not reachable"
          fi

          echo "---"

      - name: Deploy Laravel project files
        id: ftp-deploy
        # This will deploy to the current FTP directory (./) which should be your domain root
        # - Core Laravel folders (app, bootstrap, config, etc.) at root level
        # - public_html/ folder containing web-accessible files
        # - storage/ folder at root level (not inside public_html)
        # Note: server-dir: ./ means deploy to current FTP directory, not create nested paths
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: 45.84.207.200
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy_temp/
          server-dir: ./
          state-name: .ftp-deploy-sync-state.json
          log-level: verbose
          timeout: 1800
          max-retries: 10
          dangerous-clean-slate: true
          exclude: |
            .git*
            .git*/
            node_modules/**
            vendor/**
            .github/**
            tests/**
            *.md
            .DS_Store
            Thumbs.db
            storage/**
            bootstrap/cache/**
            *.log
            .env.example
            composer.lock
            package-lock.json
            yarn.lock

      - name: Verify deployment success
        run: |
          echo "Checking if deployment was successful..."
          if [ "${{ steps.ftp-deploy.outcome }}" = "success" ]; then
            echo "✅ Deployment completed successfully!"
          else
            echo "❌ Deployment failed"
            exit 1
          fi

      - name: Setup Laravel storage symlink and clear cache via web request
        run: |
          echo "Waiting 10 seconds for files to sync..."
          sleep 10
          echo "Running post-deployment setup (cache clearing + storage symlink)..."
          response=$(curl -s -w "HTTPSTATUS:%{http_code}" https://smm-followerss.com/setup_storage.php)
          http_code=$(echo "$response" | tr -d '\n' | sed -e 's/.*HTTPSTATUS://')
          body=$(echo "$response" | sed -e 's/HTTPSTATUS\:.*//g')

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" -eq 200 ]; then
            echo "✅ Post-deployment setup completed successfully!"
          else
            echo "⚠️  Setup script executed but returned HTTP $http_code"
            echo "Check manually at: https://smm-followerss.com/setup_storage.php"
          fi

      - name: Post-deployment cleanup
        if: always()
        run: |
          echo "Deployment completed"
          # Remove sensitive deployment files
          rm -rf deploy_temp
