name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - List files
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Files in root ==="
          ls -la
          echo "=== Composer files ==="
          ls -la composer.*

      - name: Debug - Check PHP
        run: |
          echo "=== PHP version ==="
          php --version
          echo "=== Composer version ==="
          composer --version

      - name: Debug - Check dependencies
        run: |
          echo "=== Composer.json content ==="
          cat composer.json
          echo "=== Composer.lock exists ==="
          ls -la composer.lock

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /
          exclude: |
            **/.git*
            **/.github*
            **/node_modules/**
            **/tests/**
            **/.env
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/logs/**
            **/storage/app/public/**
            **/bootstrap/cache/**
          dangerous-clean-slate: false
          log-level: verbose

      - name: Deploy public folder to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.github*
            **/node_modules/**
            **/tests/**
          dangerous-clean-slate: false
          log-level: verbose
